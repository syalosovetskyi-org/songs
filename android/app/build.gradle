plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

android {
    namespace = "com.example.songs"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdk = flutter.minSdkVersion
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    flavorDimensions += "default"

    productFlavors {
        personal {
            dimension "default"
            applicationId "com.example.songs"
        }
        play {
            dimension "default"
            applicationId "ua.syalosovetskyi.songs"
        }
    }

    signingConfigs {
        release {
            def keystoreB64 = System.getenv("SONGS_KEYSTORE_B64")
            def password = System.getenv("SONGS_PASSWORD") ?: System.getenv("SONGS_KEYSTORE_PASSWORD")
            def alias = System.getenv("SONGS_KEY_ALIAS") ?: System.getenv("KEY_ALIAS")
            def keyPassword = System.getenv("SONGS_KEY_PASSWORD") ?: password

            if (keystoreB64) {
                def keystoreFile = new File(buildDir, "songs-release.jks")
                if (!keystoreFile.parentFile.exists()) {
                    keystoreFile.parentFile.mkdirs()
                }
                keystoreFile.bytes = keystoreB64.decodeBase64()
                storeFile = keystoreFile
                storePassword = password
                keyAlias = alias
                this.keyPassword = keyPassword
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv("SONGS_KEYSTORE_B64")) {
                signingConfig = signingConfigs.release
            } else {
                signingConfig = signingConfigs.debug
            }
        }
    }
}

dependencies {
    playImplementation platform('com.google.firebase:firebase-bom:33.7.0')
    playImplementation 'com.google.firebase:firebase-crashlytics'
}

// Ensure personal builds do not fail if google-services.json is missing
gradle.projectsEvaluated {
    tasks.matching { task ->
        task.name.contains("Personal") && (task.name.contains("GoogleServices") || task.name.contains("Crashlytics"))
    }.configureEach {
        enabled = false
    }
}

flutter {
    source = "../.."
}
