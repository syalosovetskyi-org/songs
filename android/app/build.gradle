plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.songs"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.example.songs"
        minSdk = flutter.minSdkVersion
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            def keystoreB64 = System.getenv("SONGS_KEYSTORE_B64")
            def password = System.getenv("SONGS_PASSWORD") ?: System.getenv("SONGS_KEYSTORE_PASSWORD")
            def alias = System.getenv("SONGS_KEY_ALIAS") ?: System.getenv("KEY_ALIAS")
            def keyPassword = System.getenv("SONGS_KEY_PASSWORD") ?: password

            if (keystoreB64) {
                def keystoreFile = new File(buildDir, "songs-release.jks")
                if (!keystoreFile.parentFile.exists()) {
                    keystoreFile.parentFile.mkdirs()
                }
                keystoreFile.bytes = keystoreB64.decodeBase64()
                storeFile = keystoreFile
                storePassword = password
                keyAlias = alias
                this.keyPassword = keyPassword
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv("SONGS_KEYSTORE_B64")) {
                signingConfig = signingConfigs.release
            } else {
                signingConfig = signingConfigs.debug
            }
        }
    }
}

flutter {
    source = "../.."
}
